[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "yandex-associated-conversions"
version = "0.1.0"
description = "Yandex Direct + Metrica Logs API attribution pipeline"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3", "openpyxl>=3.1,<4"]

[project.scripts]
yandex-attribution = "yandex_attribution.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
